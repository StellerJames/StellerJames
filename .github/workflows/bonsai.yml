name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'   # Run every day at 3:00 AM UTC
  workflow_dispatch:       # Lets you start a run by hand

permissions:
  contents: write          

jobs:
  grow:
    runs-on: ubuntu-latest 
    steps:
      # Step 1: Download a copy of your repo onto VM
      - uses: actions/checkout@v4

      # Step 2: Grow the bonsai images, but don't push them yet
      - uses: egorthinks/git-bonsai@v1
        with:
          github-token: ${{ secrets.BONSAI_TOKEN }}
          commit: false

      # Step 3: Save the images and push them, pulling in any new commits first
      - name: Commit and push safely
        run: |
          git config user.name "bonsai-bot"
          git config user.email "bonsai-bot@users.noreply.github.com"
          git add output
          git commit -m "chore: tend the bonsai 🌳" || echo "Nothing new to commit"
          git pull --rebase origin main
          git push origin main
